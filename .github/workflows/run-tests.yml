name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agenticgraph_vector_test
          POSTGRES_USER: agenticgraph
          POSTGRES_PASSWORD: agenticgraph
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U agenticgraph -d agenticgraph_vector_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # BoostSkillsDriftTest reads core's source. Secret AGENTICGRAPH_CHECKOUT_TOKEN: a fine-grained PAT with read-only
      # Contents access to shahzad-io/agenticgraph, needed while that repo is private.
      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: shahzad-io/agenticgraph
          path: .ci/agenticgraph
          token: ${{ secrets.AGENTICGRAPH_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Wait for Postgres
        run: |
          for i in `seq 1 30`;
          do
            nc -z 127.0.0.1 5433 && echo "Postgres is ready!" && exit 0
            echo "Waiting for Postgres..."
            sleep 1
          done
          echo "Postgres failed to start"
          exit 1

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        env:
          VECTOR_PG_HOST: 127.0.0.1
          VECTOR_PG_PORT: 5433
          VECTOR_PG_DATABASE: agenticgraph_vector_test
          VECTOR_PG_USERNAME: agenticgraph
          VECTOR_PG_PASSWORD: agenticgraph
          VECTOR_PGVECTOR_INTEGRATION: true
          AGENTICGRAPH_CORE_PATH: ${{ github.workspace }}/.ci/agenticgraph
        run: vendor/bin/pest --ci
