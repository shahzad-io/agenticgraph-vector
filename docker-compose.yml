services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agenticgraph_vector_test
      POSTGRES_USER: agenticgraph
      POSTGRES_PASSWORD: agenticgraph
    ports:
      - "${VECTOR_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticgraph -d agenticgraph_vector_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "${VECTOR_QDRANT_PORT:-16333}:6333"
